<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinPlan — Akses Ditolak</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        min-height: 100vh;
        color: #e8ede8;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #0f160f;
        background-image: url('/assets/images/bg.jpeg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        position: relative;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(15, 22, 15, 0.4);
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        background: rgba(15, 25, 15, 0.55);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(200, 212, 200, 0.18);
        border-radius: 24px;
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }
      .icon {
        font-size: 40px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #e74c3c;
      }
      p {
        font-size: 14px;
        color: #c8d4c8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        padding: 11px 22px;
        background: rgba(20, 32, 20, 0.75);
        border: 1px solid rgba(200, 212, 200, 0.25);
        border-radius: 12px;
        color: #e8ede8;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      a:hover {
        background: rgba(74, 107, 74, 0.6);
        border-color: rgba(200, 212, 200, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#128683;</div>
      <h1>Akses Ditolak</h1>
      <p>
        Akun GitHub kamu tidak terdaftar sebagai pengguna yang diizinkan untuk mengakses FinPlan.
      </p>
      <a href="/login">Kembali ke Login</a>
    </div>
  </body>
</html>
