<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPlan — Akses Ditolak</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #f85149; }
  p { font-size: 14px; color: #8b949e; line-height: 1.6; margin-bottom: 28px; }
  a {
    display: inline-block;
    padding: 10px 20px;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.15s;
  }
  a:hover { background: #30363d; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128683;</div>
  <h1>Akses Ditolak</h1>
  <p>Akun GitHub kamu tidak terdaftar sebagai pengguna yang diizinkan untuk mengakses FinPlan.</p>
  <a href="/login">Kembali ke Login</a>
</div>
</body>
</html>
