<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPlan &mdash; Login</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    color: #e8ede8;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #0f160f;
    background-image: url('/bg.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(15, 22, 15, 0.40);
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(15, 25, 15, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(200,212,200,0.18);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.45);
  }
  .card img { height: 52px; border-radius: 12px; margin-bottom: 16px; }
  .logo {
    font-size: 28px;
    font-weight: 700;
    color: #e8ede8;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 14px;
    color: #c8d4c8;
    margin-bottom: 36px;
  }
  .btn-github {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    background: rgba(20, 32, 20, 0.75);
    border: 1px solid rgba(200,212,200,0.25);
    border-radius: 12px;
    color: #e8ede8;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .btn-github:hover {
    background: rgba(74, 107, 74, 0.6);
    border-color: rgba(200,212,200,0.4);
    transform: translateY(-1px);
  }
  .btn-github svg { flex-shrink: 0; }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(200,212,200,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <img src="/logo.jpeg" alt="FinPlan">
  <div class="logo">FinPlan</div>
  <p class="tagline">Kelola keuangan bulanan kamu</p>
  <a href="/auth/github" class="btn-github">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
    </svg>
    Login dengan GitHub
  </a>
  <p class="footer">Hanya akun yang diizinkan yang bisa masuk.</p>
</div>
</body>
</html>
